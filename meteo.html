<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Météo aéronautique - Caledronie</title>

<style>
body{margin:0;font-family:system-ui;background:#0b0f14;color:#e9eef5}
.container{max-width:1100px;margin:auto;padding:20px}
.weather-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.weather-card{background:rgba(255,255,255,.06);padding:16px;border-radius:14px}
pre{background:#00000055;padding:12px;border-radius:10px;white-space:pre-wrap}
.info-row{display:flex;justify-content:space-between;margin:8px 0}
.info-sub{font-size:12px;opacity:.7}
@media(max-width:900px){.weather-grid{grid-template-columns:1fr}}
</style>
</head>

<body>
<main class="container">
<h1>Météo aéronautique</h1>

<div class="weather-grid">

<section class="weather-card">
<h2>Nouméa Magenta (NWWM)</h2>
<pre id="magentaText">Chargement…</pre>
</section>

<section class="weather-card">
<h2>Nouméa Tontouta (NWWW)</h2>
<pre id="tontoutaText">Chargement…</pre>
</section>

<section class="weather-card">
<h2>Infos utiles</h2>

<div class="info-row"><span>Heure locale</span><strong id="localTime">--:--</strong></div>
<div class="info-row"><span>Heure UTC</span><strong id="utcTime">--:--</strong></div>
<div class="info-row"><span>Indice Kp</span><strong id="kpValue">--</strong></div>
<div class="info-sub" id="kpTime">Mise à jour : --</div>

</section>

</div>
</main>

<script>
const magentaText = document.getElementById("magentaText");
const tontoutaText = document.getElementById("tontoutaText");
const localTime = document.getElementById("localTime");
const utcTime = document.getElementById("utcTime");

function updateClocks(){
  const now = new Date();
  localTime.textContent = now.toLocaleTimeString();
  utcTime.textContent =
    String(now.getUTCHours()).padStart(2,'0') + ":" +
    String(now.getUTCMinutes()).padStart(2,'0') + ":" +
    String(now.getUTCSeconds()).padStart(2,'0');
}

async function fetchText(url){
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error(r.status);
  return await r.text();
}

function cors(url){
  return "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
}

async function updateMetarTaf(){
  try{
    const magMetar = await fetchText(cors("https://tgftp.nws.noaa.gov/data/observations/metar/stations/NWWM.TXT"));
    const magTaf   = await fetchText(cors("https://tgftp.nws.noaa.gov/data/forecasts/taf/stations/NWWM.TXT"));
    const tonMetar = await fetchText(cors("https://tgftp.nws.noaa.gov/data/observations/metar/stations/NWWW.TXT"));
    const tonTaf   = await fetchText(cors("https://tgftp.nws.noaa.gov/data/forecasts/taf/stations/NWWW.TXT"));

    magentaText.textContent =
      magMetar.split("\n").slice(1).join("\n") + "\n\n" +
      magTaf.split("\n").slice(1).join("\n");

    tontoutaText.textContent =
      tonMetar.split("\n").slice(1).join("\n") + "\n\n" +
      tonTaf.split("\n").slice(1).join("\n");

  }catch(e){
    magentaText.textContent = "Erreur METAR/TAF";
    tontoutaText.textContent = "Erreur METAR/TAF";
  }
}

updateMetarTaf();
setInterval(updateMetarTaf, 10*60*1000);
setInterval(updateClocks,1000);
updateClocks();
</script>
</body>
</html>
