<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Météo aéronautique | Caledronie</title>

  <!-- EXACTEMENT le même style que le site -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- ===== MENU IDENTIQUE AU SITE ===== -->
<header class="topbar">
  <div class="container topbar_inner">
    <a class="brand" href="index.html" aria-label="Retour à l'accueil">
      <img src="logo.jpg" alt="Caledronie" class="brand_logo">
      <span class="brand_text">
        <span class="brand_name">Caledronie</span>
        <span class="brand_tag">Formation drone professionnel</span>
      </span>
    </a>

    <nav class="nav">
      <a href="index.html#formations">Formations</a>
      <a href="index.html#temoignages">Témoignages</a>
      <a href="index.html#galerie">Galerie</a>
      <a href="index.html#apropos">À propos</a>
      <a href="meteo.html" class="active">Météo</a>
      <a href="index.html#contact" class="btn_contact">Contact</a>
    </nav>
  </div>
</header>

<!-- ===== CONTENU METEO ===== -->
<main class="container meteo-page">
  <h1>Météo aéronautique</h1>

  <div class="weather-grid">

    <div class="weather-card glass">
      <h2>Nouméa Magenta (NWWM)</h2>
      <pre id="magentaText">METAR / TAF à venir…</pre>
    </div>

    <div class="weather-card glass">
      <h2>Nouméa Tontouta (NWWW)</h2>
      <pre id="tontoutaText">METAR / TAF à venir…</pre>
    </div>

    <div class="weather-card glass infos">
      <h2>Infos utiles</h2>

      <div class="info-row"><span>Heure locale</span><strong id="localTime">—</strong></div>
      <div class="info-row"><span>Heure UTC</span><strong id="utcTime">—</strong></div>
      <div class="info-row"><span>Indice Kp</span><strong id="kpValue">—</strong></div>
      <div class="info-row"><span>Nuit aéronautique</span><strong id="aeroNight">—</strong></div>

      <div class="info-sub" id="aeroNightTimes">—</div>
      <div class="info-sub" id="kpTime">Mise à jour : —</div>
    </div>

  </div>
</main>

<!-- ===== SCRIPT METEO ===== -->
<script>
const TIMEZONE = "Pacific/Noumea";

function updateClocks(){
  const now = new Date();
  localTime.textContent = new Intl.DateTimeFormat("fr-FR",{timeZone:TIMEZONE,hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(now);
  utcTime.textContent = new Intl.DateTimeFormat("fr-FR",{timeZone:"UTC",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(now);
}
setInterval(updateClocks,1000); updateClocks();

async function updateKp(){
  try{
    const r = await fetch("https://services.swpc.noaa.gov/json/planetary_k_index_1m.json");
    const d = await r.json(); const last = d[d.length-1];
    kpValue.textContent = last.kp_index ?? "—";
    kpTime.textContent = "Mise à jour : " + (last.time_tag ?? "");
  }catch{ kpValue.textContent="—"; }
}
updateKp(); setInterval(updateKp,600000);

const start="18:30", end="05:10";
function toMin(t){let[h,m]=t.split(":").map(Number);return h*60+m;}
function updateNight(){
  const now = new Date();
  const hhmm=new Intl.DateTimeFormat("fr-FR",{timeZone:TIMEZONE,hour:"2-digit",minute:"2-digit"}).format(now);
  const n=toMin(hhmm), s=toMin(start), e=toMin(end);
  const night=s>e?(n>=s||n<e):(n>=s&&n<e);
  aeroNight.textContent = night?"NUIT":"JOUR";
  aeroNightTimes.textContent = `Début : ${start} • Fin : ${end}`;
}
updateNight(); setInterval(updateNight,60000);
</script>

</body>
</html>
