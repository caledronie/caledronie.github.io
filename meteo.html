<link rel="stylesheet" href="style.css"> <!-- ton CSS habituel -->
</head>

<body>

<header>
  <div class="container topbar">
    <a class="brand" href="index.html">
      <span class="brand-badge"></span>
      <span>Caledronie</span>
    </a>

    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="formations.html">Formations</a></li>
        <li><a href="temoignages.html">Témoignages</a></li>

        <li><a class="btn" href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="meteo-page container">
  <h1>Météo aéronautique</h1>

  <div class="weather-grid">

    <section class="weather-card glass">
      <h2>Nouméa Magenta (NWWM)</h2>
      <pre id="magentaText">Chargement METAR/TAF…</pre>
    </section>

    <section class="weather-card glass">
      <h2>Nouméa Tontouta (NWWW)</h2>
      <pre id="tontoutaText">Chargement METAR/TAF…</pre>
    </section>

    <section class="weather-card glass infos">
      <h2>Infos utiles</h2>

      <div class="info-row">
        <span>Heure locale</span>
        <strong id="localTime">--:--:--</strong>
      </div>

      <div class="info-row">
        <span>Heure UTC</span>
        <strong id="utcTime">--:--:--</strong>
      </div>

      <div class="info-row">
        <span>Indice Kp</span>
        <strong id="kpValue">--</strong>
      </div>
      <div class="info-sub" id="kpTime">Mise à jour : --</div>
    </section>

  </div>
</main>

<script>
// ===== HORLOGES =====
const localTime = document.getElementById("localTime");
const utcTime   = document.getElementById("utcTime");

function updateClocks(){
  const now = new Date();
  localTime.textContent = now.toLocaleTimeString();
  utcTime.textContent =
    String(now.getUTCHours()).padStart(2,'0') + ":" +
    String(now.getUTCMinutes()).padStart(2,'0') + ":" +
    String(now.getUTCSeconds()).padStart(2,'0');
}
setInterval(updateClocks,1000);
updateClocks();

// ===== METAR / TAF (CHEMIN QUI MARCHAIT) =====
const magentaText  = document.getElementById("magentaText");
const tontoutaText = document.getElementById("tontoutaText");

function cors(url){
  return "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
}

async function fetchText(url){
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error(r.status);
  return await r.text();
}

async function updateMetarTaf(){
  try{
    const magMetar = await fetchText(cors("https://tgftp.nws.noaa.gov/data/observations/metar/stations/NWWM.TXT"));
    const magTaf   = await fetchText(cors("https://tgftp.nws.noaa.gov/data/forecasts/taf/stations/NWWM.TXT"));
    const tonMetar = await fetchText(cors("https://tgftp.nws.noaa.gov/data/observations/metar/stations/NWWW.TXT"));
    const tonTaf   = await fetchText(cors("https://tgftp.nws.noaa.gov/data/forecasts/taf/stations/NWWW.TXT"));

    magentaText.textContent =
      magMetar.split("\n").slice(1).join("\n") + "\n\n" +
      magTaf.split("\n").slice(1).join("\n");

    tontoutaText.textContent =
      tonMetar.split("\n").slice(1).join("\n") + "\n\n" +
      tonTaf.split("\n").slice(1).join("\n");

  }catch(e){
    magentaText.textContent = "Erreur METAR/TAF";
    tontoutaText.textContent = "Erreur METAR/TAF";
  }
}

updateMetarTaf();
setInterval(updateMetarTaf, 10*60*1000);
</script>

</body>
</html>
